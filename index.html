<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0608">
  <meta name="description" content="Radio Gracia y Paz — Radio cristiana online, transmitiendo esperanza las 24 horas.">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./image/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./image/icon-512.png">
  <link rel="apple-touch-icon" href="./image/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gracia y Paz">

  <title>Radio Gracia y Paz — Radio Online Cristiana 24/7</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-lights">
    <span class="light light-1"></span>
    <span class="light light-2"></span>
    <span class="light light-3"></span>
  </div>

  <button id="btnInstall" class="btn-install" hidden>
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
      <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
    </svg>
    <span>INSTALAR APP</span>
  </button>

  <!-- ════════ CONSOLA ════════ -->
  <div class="console" id="console">

    <!-- TOP BAR -->
    <div class="console-top">
      <div class="brand-tag">
        <img src="./image/logo.png" alt="logo">
        <div>
          <strong>RADIO GRACIA Y PAZ</strong>
          <small>RADIO ONLINE · 24/7</small>
        </div>
      </div>
      <div class="status-bar">
        <span class="status-item">
          <span class="led" id="ledLive"></span>
          LIVE
        </span>
        <span class="status-item" id="clock">--:--:--</span>
      </div>
    </div>

    <!-- BODY -->
    <div class="console-body">

      <!-- ZONA INFO -->
      <div class="zone-info">
        <div class="track-display">
          <span class="track-label">AHORA SUENA</span>
          <h2 class="track-title" id="songTitle">RADIO EN VIVO</h2>
          <p class="track-artist" id="songArtist">Radio Gracia y Paz</p>
        </div>

        <div class="spectrum">
          <span class="spec-label">ESPECTRO DE AUDIO</span>
          <canvas id="waveform"></canvas>
        </div>

        <div class="stats-grid">
          <div class="stat">
            <span class="stat-label">SEÑAL</span>
            <span class="stat-value" id="signalStatus">—</span>
            <span class="stat-unit">online</span>
          </div>
          <div class="stat stat--whatsapp">
            <a
              id="btnWhatsapp"
              class="btn-whatsapp"
              href="https://wa.me/541166508379?text=Hola%20Radio%20Gracia%20y%20Paz%2C%20los%20escucho%20y%20quiero%20comunicarme%20🙏"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Contactar por WhatsApp"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M20.52 3.48A11.9 11.9 0 0 0 12.05 0C5.5 0 .2 5.3.2 11.85c0 2.09.55 4.13 1.6 5.93L0 24l6.4-1.68a11.86 11.86 0 0 0 5.65 1.44h.01c6.55 0 11.85-5.3 11.85-11.85 0-3.17-1.23-6.15-3.39-8.43z"/>
              </svg>
              <span>ESCRIBINOS</span>
            </a>
          </div>
        </div>
      </div>

      <!-- ZONA DIAL -->
      <div class="zone-dial">
        <div class="dial">
          <div class="dial-inner">
            <img src="./image/logo.png" alt="Cover" id="discCover">
          </div>
          <div class="dial-ticks" id="dialTicks"></div>
          <div class="dial-needle" id="dialNeedle"></div>
        </div>
        <div class="dial-caption">
          <span class="dial-caption-dot"></span>
          <span>TRANSMISIÓN ONLINE · HD</span>
        </div>
      </div>

      <!-- ZONA CONTROLES -->
      <div class="zone-controls">
        <div class="controls-title">PANEL DE CONTROL</div>

        <button class="btn-power" id="btnPlay">
          <div class="spinner"></div>
          <span class="power-label" id="powerLabel">PLAY</span>
          <svg viewBox="0 0 24 24" id="playIcon">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <div class="ctl-row">
          <button class="ctl-btn" id="btnMute">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" id="muteIcon">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <span>MUTE</span>
          </button>

          <button class="ctl-btn" id="btnVolume">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <span>VOL</span>
          </button>
        </div>

        <div class="vol-slider" id="volumePop">
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
          <span class="vol-value" id="volValue">80</span>
        </div>
      </div>

    </div>

    <!-- BOTTOM -->
    <div class="console-bottom">
      <div class="verse-line">
        <span class="verse-icon">✝</span>
        <div class="verse-scroll">
          <p id="verseText">Cargando versículo...</p>
        </div>
        <span class="verse-ref" id="verseRef">—</span>
      </div>

      <div class="credits-line">
        <a class="ksm" href="https://ksmservicios.com.ar" target="_blank" rel="noopener">
          <img src="./image/ksm.png" alt="KSM" onerror="this.style.display='none'">
          <span>ksmservicios.com.ar</span>
        </a>
        <a class="wa" href="https://wa.me/5490000000000?text=Hola%20KSM%20Servicios,%20quiero%20contratar%20una%20radio%20web" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M20.52 3.48A11.9 11.9 0 0 0 12.05 0C5.5 0 .2 5.3.2 11.85c0 2.09.55 4.13 1.6 5.93L0 24l6.4-1.68a11.86 11.86 0 0 0 5.65 1.44h.01c6.55 0 11.85-5.3 11.85-11.85 0-3.17-1.23-6.15-3.39-8.43z"/>
          </svg>
          <span>CONTRATAR</span>
        </a>
      </div>
    </div>

  </div>

  <audio id="audioPlayer" preload="none" crossorigin="anonymous">
    <source src="https://stream.zeno.fm/mfer4shs398uv" type="audio/mpeg">
  </audio>

  <script src="./js/app.js"></script>
  <script src="./js/pwa.js"></script>
</body>
</html>
